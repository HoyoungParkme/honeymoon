<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신혼여행 · 어디로 떠날까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  .home { min-height: 100vh; display: flex; flex-wrap: wrap; align-items: stretch; }
  .intro { flex: 1 1 340px; min-width: 0; padding: 48px 24px 32px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
  .intro h1 { margin: 0; font-size: 56px; line-height: 1.1; font-weight: 900; letter-spacing: -.01em; }
  .intro p { margin: 6px 0 0; font-size: 17px; line-height: 1.6; color: var(--mute); }
  .pins { display: flex; flex-direction: column; gap: 10px; }
  .pin-row { display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 10px 16px 10px 14px; border-radius: 14px; }
  .pin-row.on { background: var(--ink); color: var(--bg); }
  .pin-row.on:hover { background: #2A3340; }
  .pin-row.off { border: 1px solid var(--line2); color: var(--dim); min-height: 48px; }
  .pins .shortcut { order: 9; align-self: flex-start; margin-top: 6px; min-height: 44px; display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--gold); }
  .pin-row .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 0 4px rgba(184,67,42,.25); flex: 0 0 auto; }
  .pin-row.off .dot { background: #C7CCD5; box-shadow: none; }
  .pin-row .txt { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .pin-row .txt b { font-size: 16px; font-weight: 900; }
  .pin-row .txt small { font-size: 12px; color: #B8C0CC; }
  .pin-row.off .txt small { color: var(--dim); }
  .stage { flex: 1 1 520px; min-width: 0; padding: 24px 16px 32px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .globe-wrap { position: relative; width: min(640px, 92vw); aspect-ratio: 1 / 1; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; border-radius: 50%; cursor: grab; }
  canvas:active { cursor: grabbing; }
  .pin { position: absolute; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 0; background: none; border: 0; padding: 0; cursor: pointer; }
  .pin svg { display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
  .pin .lbl { position: absolute; left: 100%; top: 0; margin-left: 10px; white-space: nowrap; padding: 8px 12px; border-radius: 10px; background: var(--ink); color: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,.25); text-align: left; line-height: 1.3; }
  .pin .lbl b { display: block; font-size: 14px; font-weight: 900; }
  .pin .lbl small { font-size: 11px; color: #B8C0CC; }
  .pin.dim { opacity: .45; cursor: default; }
  .pin.dim svg { width: 24px; height: 31px; }
  .pin.dim .lbl { display: none; }
  .pin.dim:hover { opacity: .9; }
  .pin.dim:hover .lbl { display: block; background: var(--card2); color: var(--mute); box-shadow: none; }
  .pin.dim .lbl small { color: var(--dim); }
  .pin[hidden] { display: none; }
  .pin:not(.dim) { z-index: 2; }
  .ctrl { display: flex; align-items: center; gap: 14px; }
  .ctrl button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line2); background: transparent; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .ctrl button:hover { background: var(--card); }
  .ctrl span { font-size: 13px; color: var(--mute); }
  .ctrl.zoom { gap: 6px; margin-top: -6px; }
  .ctrl.zoom button { width: 36px; height: 36px; }
  .ctrl.zoom button.lbl { width: auto; min-width: 64px; border-radius: 999px; padding: 0 12px; font-size: 12px; font-weight: 700; color: var(--mute); }
  .stage { padding-top: 24px; }
  .globe-wrap { overflow: hidden; border-radius: 50%; }
  .touch { display: none; }
  /* 폰: 제목 → 작은 지구본 → 나라 버튼 순서. 줌 버튼은 터치에서 의미가 없어 숨긴다 */
  @media (max-width: 899px) {
    .home { flex-direction: column; flex-wrap: nowrap; min-height: 0; }
    .intro { display: contents; }
    .intro > div { order: 1; padding: 36px 20px 0; }
    .intro h1 { font-size: 40px; }
    .intro p { font-size: 15px; }
    .stage { order: 2; flex: 0 0 auto; padding: 12px 16px 4px; gap: 8px; }
    .globe-wrap { width: min(360px, 68vw); }
    .pins { order: 3; padding: 8px 20px 40px; }
    .ctrl.zoom, .desk { display: none; }
    .touch { display: inline; }
  }
  @media (min-width: 900px) {
    .intro { padding: 64px 40px 56px 72px; }
    .intro h1 { font-size: 64px; }
    .stage { padding: 40px 56px 40px 24px; }
  }
</style>
</head>
<body>
<main class="home">
  <section class="intro">
    <div>
      <div class="kicker">2027 · HONEYMOON</div>
      <h1 style="margin-top: 18px;">어디로<br>떠날까</h1>
      <p>핀이 꽂힌 나라를 누르면<br>그 나라의 코스가 열려요.</p>
    </div>
    <nav class="pins" aria-label="여행지">
      <a class="shortcut" href="booking.html">예약 체크리스트 바로가기 →</a>
      <a class="pin-row on" href="spain.html">
        <span class="dot"></span>
        <span class="txt"><b>스페인</b><small>5.9 – 5.18 · 코스 3개</small></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <a class="pin-row on" href="greece.html">
        <span class="dot"></span>
        <span class="txt"><b>그리스</b><small>5.9 – 5.18 · 코스 3개</small></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <a class="pin-row on" href="portugal.html">
        <span class="dot"></span>
        <span class="txt"><b>포르투갈</b><small>5.9 – 5.18 · 코스 3개</small></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
      <a class="pin-row on" href="czech.html">
        <span class="dot"></span>
        <span class="txt"><b>체코</b><small>5.9 – 5.18 · 코스 3개</small></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
      </a>
    </nav>
  </section>

  <section class="stage">
    <div class="globe-wrap" id="globeWrap">
      <canvas id="globe" role="img" aria-label="돌릴 수 있는 지구본. 스페인에 노란 핀이 꽂혀 있다"></canvas>
      <div id="pins"></div>
    </div>
    <div class="ctrl">
      <button type="button" id="left" aria-label="왼쪽으로 돌리기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
      <span class="desk">드래그로 돌리고, Ctrl + 휠로 확대</span><span class="touch">끌어서 돌려요</span>
      <button type="button" id="right" aria-label="오른쪽으로 돌리기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
    </div>
    <div class="ctrl zoom" aria-label="확대·축소">
      <button type="button" id="zoomOut" aria-label="축소"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
      <button type="button" id="zoomReset" class="lbl" aria-label="원래 크기로"><span id="zoomLbl">100%</span></button>
      <button type="button" id="zoomIn" aria-label="확대"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(function () {
  'use strict';
  // 핀: 지금은 스페인만 켜져 있다. 새 여행지는 여기에 한 줄 추가하고 href 를 주면 된다
  var PINS = [
    { id: 'spain', name: '스페인', sub: '코스 3개 · 10일', lon: -3.7, lat: 40.4, href: 'spain.html' },
    { id: 'greece', name: '그리스', sub: '코스 3개 · 10일', lon: 23.7, lat: 37.98, href: 'greece.html' },
    { id: 'portugal', name: '포르투갈', sub: '코스 3개 · 10일', lon: -9.14, lat: 38.72, href: 'portugal.html' },
    { id: 'czech', name: '체코', sub: '코스 3개 · 10일', lon: 14.42, lat: 50.08, href: 'czech.html' }
  ];
  var canvas = document.getElementById('globe');
  var wrap = document.getElementById('globeWrap');
  var pinLayer = document.getElementById('pins');
  var ctx = canvas.getContext('2d');
  var projection = d3.geoOrthographic().rotate([-10, -40]);
  var path = d3.geoPath(projection, ctx);
  var land = null, borders = null, size = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  var sphere = { type: 'Sphere' };
  var graticule = d3.geoGraticule10();
  var idle = true;   // 사용자가 만지기 전엔 천천히 돈다
  var zoom = 1;      // 1 = 지구본이 꽉 참, 최대 5배

  // 핀 버튼은 한 번만 만들고 위치만 옮긴다
  PINS.forEach(function (p) {
    var el = document.createElement(p.href ? 'a' : 'div');
    el.className = 'pin' + (p.href ? '' : ' dim');
    if (p.href) el.href = p.href; else el.setAttribute('aria-hidden', 'true');
    el.innerHTML =
      '<svg width="34" height="44" viewBox="0 0 34 44" aria-hidden="true"><path d="M17 1C8 1 1 8 1 17c0 11 16 26 16 26s16-15 16-26C33 8 26 1 17 1z" fill="' + (p.href ? '#B8432A' : '#A7ADB8') + '" stroke="#FFFFFF" stroke-width="2"/><circle cx="17" cy="17" r="6" fill="#FFFFFF"/></svg>' +
      '<span class="lbl"><b>' + p.name + '</b><small>' + p.sub + '</small></span>';
    if (p.href) el.setAttribute('aria-label', p.name + ' 코스 보기');
    p.el = el;
    pinLayer.appendChild(el);
  });

  function resize() {
    size = wrap.clientWidth;
    canvas.width = size * dpr; canvas.height = size * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    projection.translate([size / 2, size / 2]).scale((size / 2 - 6) * zoom);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, size, size);
    // 캔버스 밖으로 나간 부분은 원 안에서만 그린다
    ctx.save();
    ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); ctx.clip();
    // 바다
    var g = ctx.createRadialGradient(size * 0.4, size * 0.35, size * 0.05, size * 0.5, size * 0.5, size * 0.55 * zoom);
    g.addColorStop(0, '#D6E4F2'); g.addColorStop(0.7, '#B7CDE4'); g.addColorStop(1, '#93AFCF');
    ctx.beginPath(); path(sphere); ctx.fillStyle = g; ctx.fill();
    // 육지
    if (land) {
      ctx.beginPath(); path(land); ctx.fillStyle = '#FBF8F1'; ctx.fill();
      ctx.lineWidth = 0.5; ctx.strokeStyle = '#7F93AC'; ctx.stroke();
    }
    // 국경선 (확대할수록 조금 진하게)
    if (borders) {
      ctx.beginPath(); path(borders);
      ctx.lineWidth = 0.6 + (zoom - 1) * 0.2;
      ctx.strokeStyle = 'rgba(90,108,135,' + Math.min(0.8, 0.4 + (zoom - 1) * 0.12) + ')';
      ctx.setLineDash([]); ctx.stroke();
    }
    // 위경선·테두리
    ctx.beginPath(); path(graticule); ctx.lineWidth = 0.6; ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.stroke();
    ctx.beginPath(); path(sphere); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(127,163,230,.45)'; ctx.stroke();
    ctx.restore();
    placePins();
  }

  function setZoom(z) {
    zoom = Math.max(1, Math.min(5, z));
    projection.scale((size / 2 - 6) * zoom);
    document.getElementById('zoomLbl').textContent = Math.round(zoom * 100) + '%';
    draw();
  }

  // 핀: 뒷면이면 숨긴다 (중심에서 90도 넘게 떨어지면 뒷면)
  function placePins() {
    var r = projection.rotate();
    var centre = [-r[0], -r[1]];
    PINS.forEach(function (p) {
      var back = d3.geoDistance([p.lon, p.lat], centre) > Math.PI / 2 - 0.02;
      var xy = back ? null : projection([p.lon, p.lat]);
      // 뒷면이거나 확대해서 원 밖으로 나가면 숨긴다
      var out = !xy || Math.hypot(xy[0] - size / 2, xy[1] - size / 2) > size / 2 - 8;
      p.el.hidden = out;
      if (out) return;
      p.el.style.left = xy[0] + 'px';
      p.el.style.top = xy[1] + 'px';
    });
  }

  function rotateBy(dx, dy) {
    var r = projection.rotate();
    projection.rotate([r[0] + dx, Math.max(-75, Math.min(75, r[1] + dy))]);
    draw();
  }

  // 드래그로 돌리기
  var k = 0.35, last = null;
  canvas.addEventListener('pointerdown', function (e) { idle = false; last = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) {
    if (!last) return;
    // 확대할수록 같은 드래그에 덜 돈다
    rotateBy((e.clientX - last[0]) * k / zoom, -(e.clientY - last[1]) * k * 0.8 / zoom);
    last = [e.clientX, e.clientY];
  });
  canvas.addEventListener('pointerup', function () { last = null; });
  canvas.addEventListener('pointercancel', function () { last = null; });
  document.getElementById('left').addEventListener('click', function () { idle = false; rotateBy(-25 / zoom, 0); });
  document.getElementById('right').addEventListener('click', function () { idle = false; rotateBy(25 / zoom, 0); });

  // Ctrl(또는 ⌘) + 휠로 줌. 그냥 휠은 페이지 스크롤 그대로
  wrap.addEventListener('wheel', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    e.preventDefault(); idle = false;
    setZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  }, { passive: false });
  document.getElementById('zoomIn').addEventListener('click', function () { idle = false; setZoom(zoom * 1.25); });
  document.getElementById('zoomOut').addEventListener('click', function () { idle = false; setZoom(zoom / 1.25); });
  document.getElementById('zoomReset').addEventListener('click', function () { setZoom(1); });

  // 만지기 전엔 천천히 자전
  d3.timer(function () { if (idle && land) rotateBy(0.08, 0); });

  window.addEventListener('resize', resize);
  resize();
  fetch('data/land.geojson').then(function (r) { return r.json(); }).then(function (geo) { land = geo; draw(); });
  fetch('data/borders.geojson').then(function (r) { return r.json(); }).then(function (geo) { borders = geo; draw(); });
})();
</script>
</body>
</html>
