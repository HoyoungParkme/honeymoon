<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스페인 · 예약할 것</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="site.css">
<style>
  .hero { padding: 36px 0 20px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
  .hero h1 { margin: 10px 0 0; font-size: 36px; font-weight: 900; line-height: 1.1; letter-spacing: -.01em; }
  .hero p { margin: 10px 0 0; max-width: 640px; color: var(--mute); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 24px; }
  .tabs button { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); color: var(--sub); font-weight: 700; cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .progress { font-size: 13px; color: var(--mute); margin-bottom: 20px; }
  .progress b { color: var(--ink); }
  .now { margin: 0 0 24px; border: 1px solid var(--line2); border-radius: 20px; background: var(--card); padding: 18px 20px; }
  .now h2 { margin: 0 0 10px; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--gold); }
  .now ol { margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 20px; }
  .now li a { display: flex; gap: 10px; align-items: baseline; font-size: 14px; color: var(--ink); min-height: 32px; }
  .now li a:hover { color: var(--gold); }
  .now li .due { flex: 0 0 auto; }
  .cats { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0; margin: 0 0 8px; background: var(--bg); }
  .cats a { flex: 0 0 auto; min-height: 36px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 13px; font-weight: 700; color: var(--sub); }
  .cats a:hover { border-color: var(--ink); color: var(--ink); }
  .due { display: inline-flex; align-items: center; min-height: 22px; padding: 0 8px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em; background: var(--bg); color: var(--mute); border: 1px solid var(--line2); }
  .due.hot { background: #FBF0EA; color: var(--gold); border-color: #F0D4C7; }
  .group { margin: 0 0 36px; scroll-margin-top: 64px; }
  .group h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--dim); display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; }
  .group h2 small { font-weight: 500; letter-spacing: 0; color: var(--mute); }
  .items { margin: 12px 0 0; padding: 0; list-style: none; }
  .item { scroll-margin-top: 64px; display: grid; grid-template-columns: 28px 1fr; gap: 6px 14px; padding: 16px 0; border-top: 1px solid var(--line2); }
  .item:last-child { border-bottom: 1px solid var(--line2); }
  .item input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--gold); cursor: pointer; }
  .item .main { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .item .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .item .what { font-size: 16px; font-weight: 700; line-height: 1.4; }
  .item.done .what { color: var(--dim); text-decoration: line-through; }
  .item .meta { font-size: 13px; color: var(--mute); }
  .item .meta b { color: var(--ink); font-weight: 700; }
  .item .kv { display: grid; grid-template-columns: 56px 1fr; gap: 4px 10px; font-size: 13px; line-height: 1.55; }
  .item .kv dt { margin: 0; color: var(--dim); font-weight: 700; }
  .item .kv dd { margin: 0; color: var(--sub); }
  .item .kv dd a { color: var(--gold); font-weight: 700; }
  .rphoto { display: inline-flex; flex-direction: column; gap: 2px; max-width: 320px; }
  .rphoto img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; background: var(--line); }
  .rphoto span { font-size: 10px; color: var(--dim); }
  .item .links { grid-column: 2; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .item .links a { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line2); background: var(--card); font-size: 13px; font-weight: 700; color: var(--ink); }
  .item .links a:hover { border-color: var(--ink); }
  .item .links a i { font-style: normal; font-size: 10px; font-weight: 700; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px; background: var(--bg); color: var(--mute); }
  .item .links a i.ko { background: #FBF0EA; color: var(--gold); }
  .item .links a i.of { background: #EEF5F0; color: #2F6B4D; }
  .item .links a.primary { background: var(--ink); color: #fff; border-color: var(--ink); min-height: 40px; padding: 0 16px; font-size: 14px; }
  .item .links a.primary i { background: rgba(255,255,255,.18); color: #fff; }
  .aside { margin: 8px 0 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
  .box { border: 1px solid var(--line2); border-radius: 20px; background: var(--card); padding: 22px 24px; }
  .box h3 { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--dim); }
  .box ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .box li { font-size: 13px; line-height: 1.55; color: var(--sub); padding-top: 12px; border-top: 1px solid var(--line); }
  .box li:first-child { padding-top: 0; border-top: 0; }
  .box li b { color: var(--ink); }
  .box li a { color: var(--gold); font-weight: 700; }
  .box li .tag { font-size: 11px; color: var(--mute); margin-left: 6px; }
  .box li .lk { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; }
  @media (min-width: 900px) { .hero h1 { font-size: 48px; } .item { grid-template-columns: 28px minmax(0, 1fr) 360px; } .item .links { grid-column: 3; justify-content: flex-end; align-content: flex-start; margin: 0; } }
</style>
</head>
<body>
<header class="topbar">
  <a class="back" href="./">← 지구본</a>
  <a class="back" href="spain.html">코스 선택</a>
  <span class="sp"></span>
  <span class="kicker">예약 체크리스트</span>
</header>
<main class="wrap">
  <section class="hero">
    <div>
      <div class="kicker">ESPAÑA · 2027.05.09 – 05.18</div>
      <h1>예약할 것만 모았어요</h1>
      <p>코스마다 항공·숙소·열차·입장권·식당 순서로. 금액은 1인 기준, 숙소는 2인 1실 1박. 한국어로 결제되는 곳은 <b>한국어</b>, 가장 싼 공식 창구는 <b>공식</b>으로 표시했어요. 체크 표시는 이 브라우저에만 저장돼요.</p>
    </div>
  </section>
  <nav class="tabs" id="tabs" aria-label="코스 선택"></nav>
  <p class="progress" id="progress"></p>
  <section class="now" id="now"></section>
  <nav class="cats" id="cats" aria-label="분류로 이동"></nav>
  <div id="groups"><p class="progress">불러오는 중…</p></div>
  <section class="aside">
    <div class="box"><h3>한국에서 예약하기 좋은 곳</h3><ul id="sites"></ul></div>
    <div class="box"><h3>택시·현지 이동 준비</h3><ul id="taxi"></ul></div>
  </section>
</main>
<footer class="foot" style="padding: 24px 16px 48px; font-size: 12px; color: var(--dim); text-align: center;">가격·예약 시점은 2026년 11월 기준. 예약 전 공식 사이트에서 다시 확인</footer>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var NAMES = { course1: '코스 1 · 경유', course2: '코스 2 · 직항 가성비', course3: '코스 3 · 안달루시아' };
  var data, picked = (location.hash.match(/#c([123])/) || [])[1] ? 'course' + location.hash.match(/#c([123])/)[1] : 'course1';
  var store = function () { try { return JSON.parse(localStorage.getItem('booking-done') || '{}'); } catch (e) { return {}; } };
  var save = function (o) { try { localStorage.setItem('booking-done', JSON.stringify(o)); } catch (e) {} };
  var key = function (c, g, i) { return c + '|' + g + '|' + i; };

  // 유로 금액 뒤에 원화 환산을 붙인다 (1€ = 1,500원). "€195–270" → "€195–270 (약 29.3만–40.5만 원)"
  function won(text) {
    var fmt = function (v) { v = v * 1500; return v >= 10000 ? (Math.round(v / 1000) / 10).toLocaleString('ko-KR') + '만' : (Math.round(v / 100) * 100).toLocaleString('ko-KR'); };
    return String(text).replace(/€\s?(\d+(?:\.\d+)?)(?:\s?[–~-]\s?€?(\d+(?:\.\d+)?))?/g, function (m, a, b) {
      return m + ' (약 ' + fmt(parseFloat(a)) + (b ? '–' + fmt(parseFloat(b)) : '') + ' 원)';
    });
  }
  function restRows(r) {
    if (!r) return '';
    var rt = r.rating || {}, score = rt.score == null ? '평점 미확인' : '★ ' + rt.score.toFixed(1) + (rt.n ? ' · 리뷰 ' + rt.n.toLocaleString('ko-KR') : '');
    return '<dt>대표 메뉴</dt><dd>' + r.signature.map(esc).join(' · ') + '</dd>' +
      '<dt>평점</dt><dd>' + esc(score) + (rt.url ? ' <a href="' + esc(rt.url) + '" target="_blank" rel="noopener">' + esc(rt.src || '트립어드바이저') + ' ↗</a>' : '') + '</dd>' +
      (r.review ? '<dt>리뷰 요약</dt><dd>' + esc(r.review) + '</dd>' : '') +
      (r.photo ? '<dt>사진</dt><dd><a class="rphoto" href="' + esc(r.photo.page) + '" target="_blank" rel="noopener"><img src="' + esc(r.photo.file) + '" alt="' + esc(r.name) + '" loading="lazy"><span>' + esc((r.photo.kind === 'dish' ? '대표 음식 · ' : '') + r.photo.credit) + '</span></a></dd>' : '');
  }
  function dueHtml(d) { return '<span class="due' + (d === '지금' || d === '열리면' ? ' hot' : '') + '">' + esc(d) + '</span>'; }
  function tagClass(t) { return t === '한국어' ? 'ko' : (t === '공식' ? 'of' : ''); }
  function link(l, primary) { return '<a class="' + (primary ? 'primary' : '') + '" href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + (l.tag ? '<i class="' + tagClass(l.tag) + '">' + esc(l.tag) + '</i>' : '') + '</a>'; }

  function render() {
    var done = store(), total = 0, cnt = 0;
    $('tabs').innerHTML = Object.keys(NAMES).map(function (c) {
      return '<button type="button" data-c="' + c + '" aria-pressed="' + (c === picked) + '">' + esc(NAMES[c]) + '</button>';
    }).join('');
    $('groups').innerHTML = data.courses[picked].groups.map(function (g, gi) {
      return '<section class="group" id="g' + gi + '"><h2>' + esc(g.cat) + '<small>' + esc(g.hint) + '</small></h2><ol class="items">' + g.items.map(function (it, ii) {
        var k = key(picked, gi, ii), d = !!done[k]; total++; if (d) cnt++;
        return '<li class="item' + (d ? ' done' : '') + '" id="i' + gi + '-' + ii + '"><input type="checkbox" id="' + esc(k) + '" data-k="' + esc(k) + '"' + (d ? ' checked' : '') + ' aria-label="예약 완료 표시">' +
          '<div class="main"><div class="top"><label class="what" for="' + esc(k) + '">' + esc(it.what) + '</label><span class="meta">' + esc(it.where) + ' · ' + esc(it.dates) + '</span></div>' +
          '<dl class="kv"><dt>금액</dt><dd><b>' + esc(won(it.price)) + '</b></dd><dt>언제</dt><dd>' + dueHtml(it.due) + ' ' + esc(it.when) + '</dd>' + (it.alt ? '<dt>선택지</dt><dd>' + esc(it.alt) + '</dd>' : '') + restRows(g.cat === '식당' ? findRest(it) : null) + '</dl></div>' +
          '<div class="links">' + it.links.filter(function (l) { return l.url; }).map(function (l, li) { return link(l, g.cat === '숙소' && li === 0); }).join('') + '</div></li>';
      }).join('') + '</ol></section>';
    }).join('');
    $('progress').innerHTML = '<b>' + cnt + '</b> / ' + total + ' 예약 완료 · 항목을 체크하면 저장돼요';
    $('cats').innerHTML = data.courses[picked].groups.map(function (g, gi) { return '<a href="#g' + gi + '">' + esc(g.cat) + '</a>'; }).join('');
    var now = [];
    data.courses[picked].groups.forEach(function (g, gi) { g.items.forEach(function (it, ii) { if ((it.due === '지금' || it.due === '열리면') && !done[key(picked, gi, ii)]) now.push({ it: it, id: 'i' + gi + '-' + ii }); }); });
    $('now').innerHTML = now.length ? '<h2>지금 할 것 · ' + now.length + '건</h2><ol>' + now.map(function (n) { return '<li><a href="#' + n.id + '">' + dueHtml(n.it.due) + '<span>' + esc(n.it.what) + '</span></a></li>'; }).join('') + '</ol>' : '<h2>지금 할 것</h2><p class="progress" style="margin:0">급한 건 다 체크했어요.</p>';
    document.title = NAMES[picked] + ' · 예약할 것';
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href^="#g"], a[href^="#i"]'); if (!a) return;
    var el = document.getElementById(a.getAttribute('href').slice(1)); if (!el) return;
    e.preventDefault(); el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  $('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    picked = b.getAttribute('data-c'); history.replaceState(null, '', '#c' + picked.slice(-1)); render();
  });
  $('groups').addEventListener('change', function (e) {
    var cb = e.target; if (cb.type !== 'checkbox') return;
    var o = store(); if (cb.checked) o[cb.getAttribute('data-k')] = 1; else delete o[cb.getAttribute('data-k')]; save(o);
    cb.closest('.item').classList.toggle('done', cb.checked);
    render();
    var n = $('groups').querySelectorAll('input:checked').length, t = $('groups').querySelectorAll('input').length;
    $('progress').innerHTML = '<b>' + n + '</b> / ' + t + ' 예약 완료 · 항목을 체크하면 저장돼요';
  });

  var rest = {};
  function findRest(it) { var ks = Object.keys(rest); for (var i = 0; i < ks.length; i++) { if (rest[ks[i]].match.some(function (m) { return it.what.indexOf(m) === 0; })) return rest[ks[i]]; } return null; }
  Promise.all([fetch('data/booking.json').then(function (r) { return r.json(); }), fetch('data/restaurants.json').then(function (r) { return r.json(); }).catch(function () { return {}; })]).then(function (res) {
    var j = res[0]; rest = res[1] || {};
    data = j; render();
    $('sites').innerHTML = j.sites.map(function (s) { return '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.name) + '</a><span class="tag">' + esc(s.for) + '</span><br>' + esc(s.note) + '</li>'; }).join('');
    $('taxi').innerHTML = j.taxi.map(function (t) { return '<li><b>' + esc(t.what) + '</b><br>' + esc(t.note) + (t.links.length ? '<div class="lk">' + t.links.map(function (l) { return '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.name) + ' ↗</a>'; }).join('') + '</div>' : '') + '</li>'; }).join('');
  }).catch(function (e) { $('groups').innerHTML = '<p class="progress" style="color:#9C3A22">데이터를 불러오지 못했어요: ' + esc(e.message) + '</p>'; });
})();
</script>
</body>
</html>
